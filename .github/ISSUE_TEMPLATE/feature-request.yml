name: ✨ Feature Request
description: Suggest a new feature for the Pinch iOS app
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature for the Pinch iOS app!
        
        Please provide as much detail as possible to help us understand your idea.

  - type: checkboxes
    id: terms
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting your feature request
      options:
        - label: I have searched the existing issues to make sure this feature hasn't been requested yet
          required: true
        - label: This feature request is related to the Pinch app functionality
          required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you'd like to see
      placeholder: Describe the feature you'd like to see added...
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's the use case?
      placeholder: Explain the problem this feature would solve...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: Describe how you envision this feature working...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative approaches?
      placeholder: Describe alternative solutions you've considered...

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature Area
      description: Which area of the app would this feature affect?
      options:
        - Pinch/Zoom Gestures
        - Image Display
        - Navigation
        - User Interface
        - Performance
        - Animations
        - Image Drawer/Thumbnails
        - Info Panel
        - Controls
        - Settings/Configuration
        - Accessibility
        - Other (please specify in additional context)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - High (Essential for app usability)
        - Medium (Would significantly improve experience)
        - Low (Nice to have enhancement)
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups/Examples
      description: If applicable, add mockups, sketches, or examples to help illustrate your idea
      placeholder: Drag and drop images here or paste URLs

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the feature request here
      placeholder: Any additional information that might be helpful...

  - type: dropdown
    id: willingness-to-contribute
    attributes:
      label: Willingness to Contribute
      description: Are you willing to help implement this feature?
      options:
        - "Yes, I'd like to work on this"
        - "Yes, I can help with design/planning"
        - "Yes, I can help with testing"
        - "No, but I'm happy to provide more info if needed"
        - "Not sure"